name: Deploy AFS Market Intelligence (Cloud Run)

# Opcional: exige secret FIREBASE_SERVICE_ACCOUNT (JSON da service account GCP).
# Sem o secret, o job termina em verde e o app segue no plano Spark (Firestore direto).
# Plano Spark não suporta Cloud Functions; admin AFS usa e-mail nas firestore.rules.

on:
  push:
    branches: [main]
    paths:
      - "afs-market-intelligence/**"
      - ".github/workflows/deploy-afs-market-cloudrun.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GCP_PROJECT: contabilidade-ebed6
  GCP_REGION: southamerica-east1
  SERVICE_NAME: afs-market-intelligence

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when GCP credentials are not configured
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: |
          echo "FIREBASE_SERVICE_ACCOUNT não configurado — deploy Cloud Run ignorado."
          echo "O AFS Market funciona no Spark via Firestore (browser-api.js)."

      - name: Authenticate to Google Cloud
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Enable required APIs
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --quiet

      - name: Deploy to Cloud Run
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        working-directory: afs-market-intelligence
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --source . \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "PORT=8080,DB_ENGINE=duckdb,DB_PATH=/app/data/afs_market.duckdb" \
            --memory 2Gi \
            --cpu 2 \
            --timeout 3600 \
            --max-instances 3 \
            --quiet

      - name: Resolve service URL
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        id: service
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "AFS Market API URL: ${URL}"

      - name: Update config.json for GitHub Pages
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'site-de-notas-futurista/public/afs-market-intelligence/config.json';
            fs.mkdirSync('site-de-notas-futurista/public/afs-market-intelligence', { recursive: true });
            fs.writeFileSync(path, JSON.stringify({ apiBase: '${{ steps.service.outputs.url }}' }, null, 2));
          "

      - name: Commit config.json
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site-de-notas-futurista/public/afs-market-intelligence/config.json
          git diff --staged --quiet || git commit -m "Atualizar AFS Market API URL (Cloud Run) [skip market]"
          git push
