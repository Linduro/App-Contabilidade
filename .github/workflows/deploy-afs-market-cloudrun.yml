name: Deploy AFS Market Intelligence (Cloud Run)

# Opcional. Para ativar:
#   1. Settings → Secrets → FIREBASE_SERVICE_ACCOUNT (JSON da service account GCP)
#   2. Settings → Variables → ENABLE_GCP_CLOUD_RUN = true
# Sem isso o job termina em verde; o app segue no Spark via Firestore (browser-api.js).

on:
  push:
    branches: [main]
    paths:
      - "afs-market-intelligence/**"
      - ".github/workflows/deploy-afs-market-cloudrun.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GCP_PROJECT: contabilidade-ebed6
  GCP_REGION: southamerica-east1
  SERVICE_NAME: afs-market-intelligence

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when GCP Cloud Run deploy is disabled
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN != 'true' }}
        run: |
          echo "ENABLE_GCP_CLOUD_RUN não é 'true' — deploy Cloud Run ignorado."
          echo "O AFS Market funciona no Spark via Firestore (browser-api.js)."

      - name: Authenticate to Google Cloud
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Verify service account project matches GCP_PROJECT
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        env:
          CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_PROJECT=$(python3 - <<'PY'
          import json, os
          print(json.loads(os.environ["CREDENTIALS_JSON"]).get("project_id", ""))
          PY
          )
          echo "Service account project: ${SA_PROJECT}"
          if [ "${SA_PROJECT}" != "${{ env.GCP_PROJECT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT pertence a '${SA_PROJECT}', esperado '${{ env.GCP_PROJECT }}'."
            exit 1
          fi

      - name: Enable required APIs
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        run: |
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com containerregistry.googleapis.com --quiet
          echo "APIs Cloud Run habilitadas."

      - name: Deploy to Cloud Run
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        working-directory: afs-market-intelligence
        run: |
          set -e
          if ! gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --source . \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "PORT=8080,DB_ENGINE=duckdb,DB_PATH=/app/data/afs_market.duckdb" \
            --memory 2Gi \
            --cpu 2 \
            --timeout 3600 \
            --max-instances 3 \
            --quiet; then
            echo "::error::Deploy Cloud Run falhou. Conceda à service account do FIREBASE_SERVICE_ACCOUNT:"
            echo "  • Cloud Run Admin"
            echo "  • Cloud Build Editor"
            echo "  • Service Account User"
            echo "  • Storage Admin (ou Storage Object Admin)"
            echo "  • Artifact Registry Writer"
            echo "Console: https://console.cloud.google.com/iam-admin/iam?project=${{ env.GCP_PROJECT }}"
            exit 1
          fi

      - name: Resolve service URL
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        id: service
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "AFS Market API URL: ${URL}"

      - name: Update config.json for GitHub Pages
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: node scripts/update-afs-market-config.mjs

      - name: Set AFS_MARKET_API_URL repository variable
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || github.token }}
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          gh variable set AFS_MARKET_API_URL --repo "${{ github.repository }}" --body "${SERVICE_URL}" || \
            echo "::warning::Não foi possível gravar AFS_MARKET_API_URL (ok se config.json foi atualizado)."

      - name: Commit config.json
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site-de-notas-futurista/public/afs-market-intelligence/config.json
          git diff --staged --quiet || git commit -m "Atualizar AFS Market API URL (Cloud Run) [skip market]"
          git push

      - name: Trigger GitHub Pages redeploy
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --repo "${{ github.repository }}" --ref main
