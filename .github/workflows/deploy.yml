name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GITHUB_SITE_BASE: /App-Contabilidade
  NETWORKING_PAGES_SEGMENT: _internal/f7c2-network

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install portal dependencies
        working-directory: site-de-notas-futurista
        run: npm ci

      - name: Copy AFS static assets
        working-directory: site-de-notas-futurista
        env:
          AFS_API_URL: ${{ vars.AFS_API_URL || '' }}
          NEXT_PUBLIC_AFS_API_URL: ${{ vars.AFS_API_URL || '' }}
        run: node scripts/copy-afs-static.mjs

      - name: Copy AFS Market Intelligence static assets
        working-directory: site-de-notas-futurista
        env:
          AFS_MARKET_API_URL: ${{ vars.AFS_MARKET_API_URL || '' }}
          NEXT_PUBLIC_AFS_MARKET_API_URL: ${{ vars.AFS_MARKET_API_URL || '' }}
        run: node scripts/copy-afs-market-static.mjs

      - name: Build portal (static)
        working-directory: site-de-notas-futurista
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DATAJUD_PROXY_URL: ${{ vars.DATAJUD_PROXY_URL || '' }}
          NEXT_PUBLIC_AFS_API_URL: ${{ vars.AFS_API_URL || '' }}
          NEXT_PUBLIC_AFS_MARKET_API_URL: ${{ vars.AFS_MARKET_API_URL || '' }}
        run: npm run build

      - name: Install networking-web dependencies
        working-directory: networking-web
        env:
          NODE_ENV: development
        run: npm ci --no-audit --no-fund

      - name: Build networking (subpasta discreta no mesmo domínio)
        working-directory: networking-web
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_API_URL: ${{ vars.NETWORKING_API_URL || '' }}
        run: npm run build

      - name: Mesclar networking em _internal/f7c2-network
        run: |
          mkdir -p site-de-notas-futurista/out/${{ env.NETWORKING_PAGES_SEGMENT }}
          cp -R networking-web/out/. site-de-notas-futurista/out/${{ env.NETWORKING_PAGES_SEGMENT }}/
          touch site-de-notas-futurista/out/.nojekyll
          touch site-de-notas-futurista/out/${{ env.NETWORKING_PAGES_SEGMENT }}/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-de-notas-futurista/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
