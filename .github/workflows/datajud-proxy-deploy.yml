name: Deploy Datajud proxy (Cloudflare Worker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/datajud-proxy/**"
      - ".github/workflows/datajud-proxy-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker
        working-directory: workers/datajud-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 deploy
