name: Deploy Datajud proxy (Cloudflare Worker)

# Opcional. Para ativar:
#   Variable ENABLE_DATAJUD_PROXY_DEPLOY = true
#   Secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/datajud-proxy/**"
      - ".github/workflows/datajud-proxy-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Datajud proxy deploy is disabled
        if: ${{ vars.ENABLE_DATAJUD_PROXY_DEPLOY != 'true' }}
        run: echo "ENABLE_DATAJUD_PROXY_DEPLOY não é 'true' — deploy do Worker ignorado."

      - uses: actions/setup-node@v4
        if: ${{ vars.ENABLE_DATAJUD_PROXY_DEPLOY == 'true' }}
        with:
          node-version: 22

      - name: Deploy Worker
        if: ${{ vars.ENABLE_DATAJUD_PROXY_DEPLOY == 'true' }}
        working-directory: workers/datajud-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 deploy
