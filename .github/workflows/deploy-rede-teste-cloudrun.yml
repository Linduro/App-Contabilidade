name: Deploy Rede Teste (Cloud Run)

# Ativar:
#   Settings → Secrets: FIREBASE_SERVICE_ACCOUNT, REDE_TESTE_DATABASE_URL, REDE_TESTE_AUTH_SECRET
#   Settings → Variables: ENABLE_REDE_TESTE_CLOUD_RUN = true
#   FIREBASE_SERVICE_ACCOUNT deve ser JSON do projeto contabilidade-ebed6 (mesmo do portal Firebase).
#   Depois do 1º deploy: REDE_TESTE_URL = URL do Cloud Run (para o portal GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "rede-teste-web/**"
      - ".github/workflows/deploy-rede-teste-cloudrun.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT: contabilidade-ebed6
  GCP_REGION: southamerica-east1
  SERVICE_NAME: rede-teste

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Cloud Run deploy is disabled
        if: ${{ vars.ENABLE_REDE_TESTE_CLOUD_RUN != 'true' }}
        run: |
          echo "ENABLE_REDE_TESTE_CLOUD_RUN não é 'true' — deploy ignorado."
          echo "Defina a variável no GitHub para publicar a Rede Teste."

      - name: Authenticate to Google Cloud
        if: ${{ vars.ENABLE_REDE_TESTE_CLOUD_RUN == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ vars.ENABLE_REDE_TESTE_CLOUD_RUN == 'true' }}
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Verify service account project matches GCP_PROJECT
        if: ${{ vars.ENABLE_REDE_TESTE_CLOUD_RUN == 'true' }}
        env:
          CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_PROJECT=$(python3 - <<'PY'
          import json, os
          print(json.loads(os.environ["CREDENTIALS_JSON"]).get("project_id", ""))
          PY
          )
          echo "Service account project: ${SA_PROJECT}"
          echo "Workflow GCP_PROJECT: ${{ env.GCP_PROJECT }}"
          if [ "${SA_PROJECT}" != "${{ env.GCP_PROJECT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT pertence a '${SA_PROJECT}', mas o workflow usa '${{ env.GCP_PROJECT }}'."
            echo "Gere a chave em Firebase Console → projeto contabilidade-ebed6 → Service accounts."
            exit 1
          fi

      - name: Enable required APIs
        if: ${{ vars.ENABLE_REDE_TESTE_CLOUD_RUN == 'true' }}
        continue-on-error: true
        run: |
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --quiet

      - name: Deploy to Cloud Run
        if: ${{ vars.ENABLE_REDE_TESTE_CLOUD_RUN == 'true' }}
        working-directory: rede-teste-web
        env:
          DATABASE_URL: ${{ secrets.REDE_TESTE_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.REDE_TESTE_AUTH_SECRET }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Secret REDE_TESTE_DATABASE_URL ausente ou vazio."
            exit 1
          fi
          if [ -z "${AUTH_SECRET}" ]; then
            echo "Secret REDE_TESTE_AUTH_SECRET ausente ou vazio."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          env = {
              "DATABASE_URL": os.environ["DATABASE_URL"],
              "BETTER_AUTH_SECRET": os.environ["AUTH_SECRET"],
              "NEXT_PUBLIC_PORTAL_URL": "https://linduro.github.io/App-Contabilidade",
              "FIREBASE_PROJECT_ID": "contabilidade-ebed6",
              "NODE_ENV": "production",
          }
          with open("/tmp/rede-teste-env.yaml", "w", encoding="utf-8") as f:
              for key, value in env.items():
                  f.write(f"{key}: {json.dumps(value)}\n")
          PY
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --source . \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --env-vars-file /tmp/rede-teste-env.yaml \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 3 \
            --quiet

      - name: Set BETTER_AUTH_URL to service URL
        if: ${{ vars.ENABLE_REDE_TESTE_CLOUD_RUN == 'true' }}
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.GCP_REGION }}" --format='value(status.url)')
          gcloud run services update "${{ env.SERVICE_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --update-env-vars "BETTER_AUTH_URL=${URL}" \
            --quiet
          echo "Rede Teste URL: ${URL}"
          echo "Adicione em GitHub → Settings → Variables → REDE_TESTE_URL = ${URL}"
