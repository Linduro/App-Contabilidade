name: Execuções Rurais — Coleta

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent
        working-directory: agent
        run: npm ci
      - name: Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "${{ runner.temp }}/firebase-sa.json"
      - name: Coleta execuções rurais
        working-directory: agent
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}
        run: npm run collect:execucoes
