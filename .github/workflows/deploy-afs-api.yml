name: Deploy AFS API (Render)

# Opcional. Para ativar:
#   1. Secret RENDER_DEPLOY_HOOK
#   2. Variable ENABLE_RENDER_DEPLOY = true

on:
  push:
    branches: [main]
    paths:
      - "afs-valuation/**"
      - "render.yaml"
      - ".github/workflows/deploy-afs-api.yml"
  workflow_dispatch:

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when Render deploy is disabled
        if: ${{ vars.ENABLE_RENDER_DEPLOY != 'true' }}
        run: echo "ENABLE_RENDER_DEPLOY não é 'true' — deploy da API ignorado."

      - name: Trigger Render deploy
        if: ${{ vars.ENABLE_RENDER_DEPLOY == 'true' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
