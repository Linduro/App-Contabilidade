name: Deploy AFS API (Render)

on:
  push:
    branches: [main]
    paths:
      - "afs-valuation/**"
      - "render.yaml"
      - ".github/workflows/deploy-afs-api.yml"
  workflow_dispatch:

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when Render hook is not configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK == '' }}
        run: echo "RENDER_DEPLOY_HOOK não configurado — deploy da API ignorado."

      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
