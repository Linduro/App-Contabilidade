name: Deploy AFS API (Render)

on:
  push:
    branches: [main]
    paths:
      - "afs-valuation/**"
      - "render.yaml"
      - ".github/workflows/deploy-afs-api.yml"
  workflow_dispatch:

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
