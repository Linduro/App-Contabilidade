name: Deploy AFS API (Cloud Run)

# Opcional. Para ativar:
#   1. Secret FIREBASE_SERVICE_ACCOUNT
#   2. Variable ENABLE_GCP_CLOUD_RUN = true
# Alternativa gratuita: deploy-afs-api.yml (Render).

on:
  push:
    branches: [main]
    paths:
      - "afs-valuation/**"
      - "render.yaml"
      - ".github/workflows/deploy-afs-cloudrun.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GCP_PROJECT: contabilidade-ebed6
  GCP_REGION: southamerica-east1
  SERVICE_NAME: afs-valuation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when GCP Cloud Run deploy is disabled
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN != 'true' }}
        run: echo "ENABLE_GCP_CLOUD_RUN não é 'true' — deploy Cloud Run ignorado."

      - name: Authenticate to Google Cloud
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Enable required APIs
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        run: |
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --quiet

      - name: Deploy to Cloud Run
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        working-directory: afs-valuation
        env:
          GEMINI_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          ENV_VARS="PORT=8080"
          if [ -n "$GEMINI_KEY" ]; then
            ENV_VARS="${ENV_VARS},GOOGLE_API_KEY=${GEMINI_KEY}"
          fi
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --source . \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "${ENV_VARS}" \
            --memory 1Gi \
            --cpu 1 \
            --timeout 3600 \
            --max-instances 3 \
            --quiet

      - name: Resolve service URL
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        id: service
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "AFS API URL: ${URL}"

      - name: Update config.json for GitHub Pages
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'site-de-notas-futurista/public/afs-valuation/config.json';
            fs.writeFileSync(path, JSON.stringify({ apiBase: '${{ steps.service.outputs.url }}' }, null, 2));
          "

      - name: Commit config.json
        if: ${{ vars.ENABLE_GCP_CLOUD_RUN == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site-de-notas-futurista/public/afs-valuation/config.json
          git diff --staged --quiet || git commit -m "Atualizar AFS API URL (Cloud Run) [skip afs]"
          git push
