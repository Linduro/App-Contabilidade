name: Execuções Alto Valor — Coleta

# Manual. Para ativar: ENABLE_FIREBASE_COLLECT = true + FIREBASE_SERVICE_ACCOUNT

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Firebase collect is disabled
        if: ${{ vars.ENABLE_FIREBASE_COLLECT != 'true' }}
        run: echo "ENABLE_FIREBASE_COLLECT não é 'true' — coleta ignorada."

      - uses: actions/setup-node@v4
        if: ${{ vars.ENABLE_FIREBASE_COLLECT == 'true' }}
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: ${{ vars.ENABLE_FIREBASE_COLLECT == 'true' }}
        with:
          python-version: "3.12"

      - name: Install agent
        if: ${{ vars.ENABLE_FIREBASE_COLLECT == 'true' }}
        working-directory: agent
        run: npm ci

      - name: Firebase credentials
        if: ${{ vars.ENABLE_FIREBASE_COLLECT == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "${{ runner.temp }}/firebase-sa.json"

      - name: Coleta execuções alto valor
        if: ${{ vars.ENABLE_FIREBASE_COLLECT == 'true' }}
        working-directory: agent
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npm run collect:alto-valor
