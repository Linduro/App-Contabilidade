name: Configure Rede Teste (Render)

# Requer secrets no GitHub:
#   RENDER_API_KEY
#   REDE_TESTE_DATABASE_URL (Supabase Postgres)
#   REDE_TESTE_AUTH_SECRET
#   REDE_TESTE_SUPABASE_SERVICE_ROLE_KEY
#   REDE_TESTE_SUPABASE_SECRET_KEY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "render.yaml"
      - "rede-teste-web/**"
      - "scripts/push-rede-teste-render-env.mjs"
      - ".github/workflows/configure-rede-teste-render.yml"

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write .env.render from secrets
        env:
          DATABASE_URL: ${{ secrets.REDE_TESTE_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.REDE_TESTE_AUTH_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.REDE_TESTE_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.REDE_TESTE_SUPABASE_SECRET_KEY }}
        run: |
          cat > rede-teste-web/.env.render <<EOF
          DATABASE_URL=${DATABASE_URL}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          BETTER_AUTH_URL=https://rede-teste.onrender.com
          NEXT_PUBLIC_SUPABASE_URL=https://diuudxdcemegubuajvql.supabase.co
          SUPABASE_URL=https://diuudxdcemegubuajvql.supabase.co
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
          SUPABASE_STORAGE_BUCKET=advforte
          NEXT_PUBLIC_PORTAL_URL=https://linduro.github.io/App-Contabilidade
          FIREBASE_PROJECT_ID=contabilidade-ebed6
          NODE_ENV=production
          EOF

      - name: Push env vars to Render and deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::Secret RENDER_API_KEY ausente."
            echo "Crie em https://dashboard.render.com/u/settings#api-keys e adicione em GitHub → Settings → Secrets."
            exit 0
          fi
          node scripts/push-rede-teste-render-env.mjs
