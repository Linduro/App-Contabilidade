<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>AFS Market Intelligence</title>
    <link rel="stylesheet" href="./css/style.css?v=3">
    <link rel="stylesheet" href="./css/layout-v2.css?v=3">
    <script>window.__AFS_BASE_PATH__="";window.__AFS_BUILD__="2026-06-13174937";</script>
</head>
<body>

<div id="afs-login">
    <div class="login-card" style="text-align:center">
        <div class="brand" style="margin-bottom:1.5rem;justify-content:center;display:flex;gap:0.75rem;align-items:center">
            <div class="brand-icon">AFS</div>
            <div style="text-align:left">
                <h2 style="font-size:1rem">Market Intelligence</h2>
                <p class="hint">Asset Flow Solutions</p>
            </div>
        </div>
        <p id="login-status">Verificando sessão do portal…</p>
        <p class="hint">Use o mesmo e-mail e senha do login principal.</p>
        <p id="login-fallback" class="hidden" style="margin-top:1rem">
            <a id="login-fallback-link" class="btn primary" href="#">Ir para o login do portal</a>
        </p>
        <p id="login-recovery" class="hidden" style="margin-top:0.75rem">
            <button type="button" id="btn-reset-afs" class="btn sm">Limpar dados locais e recarregar</button>
        </p>
    </div>
</div>

<!-- Casca nova (Leads2b-style) -->
<div id="app-root" class="l2-shell hidden">
    <aside id="l2-sidebar"></aside>
    <div class="l2-main">
        <header id="l2-header"></header>
        <main id="l2-content"></main>
    </div>
</div>

<!-- UI legada (#/legacy) -->
<div id="legacy-root" class="hidden"></div>

<script src="./js/toast.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
(async function bootstrapAFS() {
    const status = document.getElementById('login-status');
    try {
        const configPaths = ['./config.json', '/static/config.json'];
        for (const p of configPaths) {
            try {
                const r = await fetch(p + '?t=' + Date.now());
                if (!r.ok) continue;
                const cfg = await r.json();
                if (cfg.firebase) window.__AFS_FB_CONFIG__ = cfg.firebase;
                else if (cfg.apiKey) window.__AFS_FB_CONFIG__ = cfg;
                if (cfg.apiBase) window.__AFS_MARKET_API_BASE__ = String(cfg.apiBase).replace(/\/$/, '');
                if (cfg.prospectDefaults) window.__AFS_PROSPECT_DEFAULTS__ = cfg.prospectDefaults;
                break;
            } catch (_) {}
        }
        const buildTag = window.__AFS_BUILD__ || Date.now();
        if (new URLSearchParams(location.search).has('afs_reset')) {
            try { localStorage.removeItem('afs_market_v2'); } catch (_) {}
        }
        const { startAuthGate } = await import('./js/auth-gate.js?b=' + buildTag);
        startAuthGate(async function () {
            const { bootApp } = await import('./js/core/boot.js?b=' + buildTag);
            await bootApp();
        });
    } catch (err) {
        console.error('[AFS-ERROR] bootstrap', err);
        if (status) status.textContent = 'Falha ao iniciar: ' + (err.message || err);
        document.getElementById('login-fallback')?.classList.remove('hidden');
    }
})();
</script>
</body>
</html>
