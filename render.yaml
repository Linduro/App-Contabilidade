services:
  - type: web
    name: afs-valuation
    runtime: docker
    rootDir: afs-valuation
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: rede-teste
    runtime: docker
    rootDir: rede-teste-web
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /rede-teste
    envVars:
      # Postgres Render (auto). Workflow configure-rede-teste-render troca para Supabase quando RENDER_API_KEY existir.
      - key: DATABASE_URL
        fromDatabase:
          name: rede-teste-db
          property: connectionString
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://diuudxdcemegubuajvql.supabase.co
      - key: SUPABASE_URL
        value: https://diuudxdcemegubuajvql.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: advforte
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://rede-teste.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://linduro.github.io/App-Contabilidade
      - key: FIREBASE_PROJECT_ID
        value: contabilidade-ebed6
      - key: NODE_ENV
        value: production

databases:
  - name: rede-teste-db
    plan: free
    databaseName: rede_teste
    user: rede_teste
